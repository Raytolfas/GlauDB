[package]
name = "glaudb"
version = "0.1.0"
edition = "2021"
description = "GlauDB — fast embedded database engine & server"

[[bin]]
name = "glaudb"
path = "src/main.rs"

[dependencies]
redb = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2.5"
log = "0.4"
env_logger = "0.11"
axum = { version = "0.7", features = ["ws", "multipart"] }
mime_guess = "2.0"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
rust-embed = { version = "8.3", features = ["tokio"] }
jsonwebtoken = "9"
argon2 = "0.5"
sysinfo = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1.5"

[dev-dependencies]
tempfile = "3"
