name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build GlauDB
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: glaudb
            asset_name: glaudb-linux
          - os: windows-latest
            artifact_name: glaudb.exe
            asset_name: glaudb-windows.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd glaudb-admin
          npm install
          npm run build

      - name: Build unified GlauDB binary
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            glaudb-linux/glaudb
            glaudb-windows.exe/glaudb.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
